name: Bug 反馈
description: 报告一个可以复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请先确认问题在最新 Release 中仍然存在。
  - type: textarea
    id: what-happened
    attributes:
      label: 描述问题
      description: 发生了什么？你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开记录页
        2. 点击「记一笔」
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 手机型号、Android 版本、安装来源（Release APK / 自编译 / HBuilderX 基座）
      placeholder: 例如：Pixel 6，Android 14，Release v1.0.0 APK
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏（可选）
