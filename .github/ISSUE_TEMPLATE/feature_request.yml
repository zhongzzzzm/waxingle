name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 建议先看看 README 的 Roadmap 与 docs/设计方案.md 第 6 节迭代规划，避免重复提案。
  - type: textarea
    id: problem
    attributes:
      label: 场景与问题
      description: 你在什么场景下遇到了什么不方便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
